name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          RAW_VER=$(java -version 2>&1 | grep -i "version" | head -n 1)
          echo "Java version string: $RAW_VER"
          JAVA_MAJOR=$(echo "$RAW_VER" | sed -E 's/.*version "([0-9]+).*/\1/')
          if [[ ! "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Unable to detect Java major version from '$RAW_VER'"
            exit 1
          fi
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java major version must be 17 or newer (detected: $JAVA_MAJOR)"
            exit 1
          fi
          echo "Java environment verified successfully (Java $JAVA_MAJOR >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK not found at $EXPECTED_APK"
            echo "Searching files inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: $EXPECTED_APK is empty (0 bytes)."
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "ERROR: $EXPECTED_APK does not have .apk extension."
            exit 1
          fi

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: APK path is not exactly app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi

          echo "Verified debug APK exists at $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RUNNER_TEMP_DIR="${{ runner.temp }}/release-assets"
          mkdir -p "$RUNNER_TEMP_DIR"

          RAW_REPO_NAME="${{ github.event.repository.name }}"
          if [ -z "$RAW_REPO_NAME" ]; then
            RAW_REPO_NAME=$(basename "${{ github.repository }}")
          fi
          SANITIZED_REPO=$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_-]+/-/g' | sed -E 's/^-+|-+$//g')
          if [ -z "$SANITIZED_REPO" ]; then
            SANITIZED_REPO="app"
          fi

          ASSET_FILENAME="${SANITIZED_REPO}-debug-build-${{ github.run_number }}.apk"
          DEST_PATH="${RUNNER_TEMP_DIR}/${ASSET_FILENAME}"

          cp app/build/outputs/apk/debug/app-debug.apk "$DEST_PATH"

          if [ ! -s "$DEST_PATH" ]; then
            echo "ERROR: Failed to prepare release asset at $DEST_PATH"
            exit 1
          fi

          echo "Prepared release asset: $DEST_PATH"
          echo "asset_path=$DEST_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset missing or empty at '$ASSET_PATH'"
            exit 1
          fi

          if [[ "$ASSET_PATH" != *.apk ]]; then
            echo "ERROR: Release asset is not an APK: '$ASSET_PATH'"
            exit 1
          fi

          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"

          RELEASE_NOTES="### Arushi AI Voice Assistant - Debug Build

This is an automatically generated debug APK.
- **Built by**: GitHub Actions
- **Run number**: ${{ github.run_number }}
- **Run attempt**: ${{ github.run_attempt }}
- **Source commit**: \`${{ github.sha }}\`
- **Notice**: This APK is intended for testing. It is not a Play Store production release and is signed only with a temporary debug keystore.

#### Download APK:
The debug APK \`${ASSET_NAME}\` is attached directly below in the Assets section."

          echo "Creating GitHub Release with tag: $TAG..."
          gh release create "$TAG" "$ASSET_PATH" \
            --title "$TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          OUTCOME="${{ steps.publish_release.outcome }}"

          echo "=========================================="
          echo "APK BUILD AND RELEASE SUMMARY"
          echo "=========================================="

          if [ "$OUTCOME" = "success" ]; then
            echo "GitHub Release publishing succeeded!"
            RELEASE_URL=$(gh release view "$TAG" --json url -q .url 2>/dev/null || echo "${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG}")
            RELEASE_TITLE=$(gh release view "$TAG" --json name -q .name 2>/dev/null || echo "Debug APK Build #${{ github.run_number }}")

            echo "Release Tag: $TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Name: $ASSET_NAME"
            echo ""
            echo "The APK is directly downloadable from the GitHub Release page Assets section."
            echo "Backup: The normal GitHub Actions artifact 'app-debug-apk' is also preserved."

            cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ###  Debug APK Built & Published Successfully

          - **Release Tag**: \`$TAG\`
          - **Release Title**: $RELEASE_TITLE
          - **Download APK from Release**: [$RELEASE_URL]($RELEASE_URL)
          - **Asset Name**: \`$ASSET_NAME\`

          > **Direct Phone Download**: Open the Release link above on your Android phone and download the \`.apk\` from the **Assets** section.
          > **Backup Artifact**: The GitHub Actions artifact named \`app-debug-apk\` is also available for this run.
          EOF
          else
            echo "::warning::GitHub Release publishing was not completed (outcome: $OUTCOME)."
            echo "APK build succeeded! The Actions artifact named 'app-debug-apk' remains available for download."

            cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ### ⚠️ Debug APK Built (Release Publishing Notice)

          - **APK Build Status**: Succeeded
          - **GitHub Actions Artifact**: \`app-debug-apk\` is uploaded and available for download in the Summary tab.
          - **Release Status**: Release publishing was not completed. You can download the APK from the GitHub Actions Artifacts section above.
          EOF
          fi
